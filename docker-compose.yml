# OpsPilot 本地中间件栈
# 内存预算：ES 768m + Qdrant 512m + Redis 128m ≈ 1.4GB ≤ 2GB 上限
# P3 生产基线：全部服务启用认证 + 端口仅绑定 127.0.0.1（防同机/局域网匿名直连绕权限）
# 凭据只从 .env 注入（compose 自动读同目录 .env）；缺失时 compose 启动即报错，不会静默裸奔
services:
  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save "" --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置（.env）}
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: opspilot-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY 未设置（.env）}
    ports:
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 512m
    # qdrant 官方镜像无 curl/wget 可做 HTTP 探活（1.12.4 实测）；冷启动 1-2s，
    # 远快于 gateway JVM（>10s），gateway 侧以 service_started 依赖 + ES 健康门控即可
    restart: unless-stopped

  # 网关本体（可复现部署形态）：docker compose --profile full up -d --build
  # 默认不随基础栈启动——宿主裸进程模式与容器模式二选一，避免抢 8081
  gateway:
    profiles: ["full"]
    build: .
    container_name: opspilot-gateway
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    env_file: .env
    environment:
      SERVER_PORT: "8081"
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      ES_HOST: elasticsearch
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    mem_limit: 768m
    restart: unless-stopped

  # LobeChat 前端（可选展示层，ADR-0007）：docker compose --profile full --profile ui up -d
  # 注意浏览器端 fetch 走宿主 localhost:8081/v1（非容器服务名），Key=用户 JWT，详见 OPS.md §8
  lobe-chat:
    profiles: ["ui"]
    image: lobehub/lobe-chat:latest
    container_name: opspilot-lobe-chat
    depends_on:
      - gateway
    environment:
      - ACCESS_CODE=${LOBE_ACCESS_CODE:?LOBE_ACCESS_CODE 未设置（.env）}
    ports:
      - "127.0.0.1:3210:3210"
    mem_limit: 512m
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: opspilot-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=true          # P3：开启原生认证（basic 免费档）
      - xpack.security.http.ssl.enabled=false # 内网单机不上 TLS（决策见 ADR-0005）
      - xpack.ml.enabled=false
      - bootstrap.memory_lock=false
      - ELASTIC_PASSWORD=${ES_PASSWORD:?ES_PASSWORD 未设置（.env）}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ES_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  qdrant-data:
  es-data:
