# OpsPilot 本地中间件栈
# 内存预算：ES 768m + Qdrant 512m + Redis 128m ≈ 1.4GB ≤ 2GB 上限
services:
  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    mem_limit: 128m
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: opspilot-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 512m
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: opspilot-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - bootstrap.memory_lock=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  qdrant-data:
  es-data:
