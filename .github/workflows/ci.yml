# 一期 CI：零凭据、零中间件即可跑——mvn 单测全 mock/H2-local；Python 侧 chunkers 不变量
# + 跨语言词法护栏 + 告警生产者判定/闸门（不触网，由 fixture 强制）；bash 侧面板契约
# 与全脚本语法检查（脚本是运维动作的入口，语法错到用的时候才发现太晚）；
# 以及"证据同代"的两个面：面一"报告↔语料"（摘要）+ 面二"文档数字↔产物"（现算），
# 外加干净检出下跑一次证据打包 smoke（O1 的验收从人工一次性变成每次复现）。
# live 依赖的 A2/A3 验收不进 CI（需 compose 栈），由本地验收脚本承担。
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Unit tests
        run: mvn -B test

  panel-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ops Console ↔ backend key contract (ADR-0009 / W11)
        run: bash scripts/check_panel_contract.sh

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 判据是内容摘要（非 mtime）：git checkout 会把所有 mtime 刷成检出时刻，
      # 时间戳判据在 CI 里恒真、等于门闩空转（见 offline/provenance.py 顶部）。
      - name: Report ⟷ corpus same-generation gate
        working-directory: offline
        run: python provenance.py --check
      # 面二：报告与语料同代 ≠ 文档里的数字是对的（人抄错/漏改，面一完全看不见）。
      # README 曾写「121 用例」而实际已是 131——同一缺陷类在面一上线后又发生了一次。
      - name: Doc numbers ⟷ artifacts gate
        working-directory: offline
        run: python doc_numbers.py --check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dev deps
        run: pip install -r offline/requirements-dev.txt   # 版本锁定见该文件（不锁=pytest 大版本变更即打红）
      - name: Chunker invariants + lexicon guards
        working-directory: offline
        run: python -m pytest tests/

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check (every script)
        run: |
          fail=0
          for f in scripts/*.sh; do
            if ! bash -n "$f"; then echo "::error file=$f::bash -n 失败"; fail=1; fi
          done
          [ "$fail" = "0" ] && echo "OK: $(ls scripts/*.sh | wc -l) 个脚本语法通过"
          exit $fail
