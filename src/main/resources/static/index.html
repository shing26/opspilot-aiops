<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsPilot · Ops Console</title>
<!--
  只读可观测面（ADR-0009）：渲染 /admin/state 与 /admin/audit/recent 的真实计数器，
  无任何写操作、无假动画、无外部依赖（离线演示可断网开）。
  HTML 本体不受守卫（零信息壳）；数据需 role=platform 的 JWT——面板粘贴后即入 localStorage
  （浏览器本地，OPS §9 有记载与清理方法）。
-->
<style>
  :root { --bg:#0b0f14; --panel:#111823; --line:#1d2a3a; --txt:#c9d7e6; --dim:#5c708a;
          --ok:#3ddc84; --warn:#ffb020; --err:#ff5d5d; --accent:#4da3ff; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace; }
  header { display:flex; justify-content:space-between; align-items:center;
           padding:10px 16px; border-bottom:1px solid var(--line); }
  header b { color:var(--accent); letter-spacing:.5px }
  #fingerprint { color:var(--dim); font-size:11px }
  main { display:grid; grid-template-columns:1fr 1.4fr; gap:12px; padding:12px 16px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  h2 { margin:0 0 8px; font-size:11px; color:var(--dim); font-weight:600; letter-spacing:1px; }
  .lights { display:flex; gap:14px; flex-wrap:wrap }
  .lamp { display:flex; align-items:center; gap:6px }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim) }
  .dot.UP{background:var(--ok)} .dot.DOWN{background:var(--err)} .dot.DEGRADED{background:var(--warn)}
  .tiles { display:grid; grid-template-columns:repeat(5,1fr); gap:6px }
  .tile { border:1px solid var(--line); border-radius:4px; padding:6px 8px; }
  .tile .v { font-size:17px } .tile .k { color:var(--dim); font-size:10px }
  .delta { color:var(--ok); font-size:10px; min-height:12px }
  #sfrow { margin-top:8px; color:var(--dim) }
  .chip { display:inline-block; border:1px solid var(--accent); color:var(--accent);
          border-radius:3px; padding:0 6px; margin:2px 3px 0 0; font-size:11px }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px }
  .bar i { display:block; height:100%; background:var(--accent) }
  #events { max-height:46vh; overflow-y:auto; font-size:11px }
  .ev { padding:2px 4px; border-bottom:1px dashed var(--line); white-space:nowrap;
        overflow:hidden; text-overflow:ellipsis }
  .ev .t{color:var(--dim)} .ev.chat .b{color:var(--accent)} .ev.search .b{color:#9a6bff}
  .ev.auth{color:var(--warn)} .ev.admin{color:#4dd0e1} .ev.invalid{color:var(--warn)}
  .ev.badge-l1 .b,.ev.badge-L2 .b{color:var(--ok)}
  .ev.refused{color:var(--err)} .ev.mismatch{background:#3a1010;color:var(--err);font-weight:700}
  .ev.lost{color:var(--warn)}
  #bounds li{margin:3px 0; list-style:none}
  #bounds .chk{color:var(--dim);font-size:10px}
  #auth { position:fixed; inset:0; background:#0b0f14e6; display:none; place-items:center }
  #auth .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
                padding:24px 28px; width:min(560px,92vw) }
  #auth input { width:100%; background:#0d1420; color:var(--txt); border:1px solid var(--line);
                border-radius:4px; padding:8px; font:inherit; margin:10px 0 }
  #auth button { background:var(--accent); color:#04121f; border:0; border-radius:4px;
                 padding:8px 18px; font:inherit; cursor:pointer }
  #auth .msg { color:var(--warn); min-height:18px }
  .sat { filter:saturate(.15) brightness(.7) }
  footer { padding:6px 16px; color:var(--dim); font-size:11px; display:flex;
           justify-content:space-between; border-top:1px solid var(--line) }
</style>
</head>
<body>
<header>
  <b>OpsPilot · Ops Console</b>
  <span id="fingerprint">build —</span>
</header>
<main>
  <div>
    <section id="status"><h2>运行状态 · RUNTIME</h2><div class="lights" id="lights"></div>
      <div id="reingest" style="margin-top:6px;color:var(--dim)"></div></section>
    <section style="margin-top:12px"><h2>降级状态机 · DEGRADE</h2>
      <div class="lights" id="deg"></div>
      <div id="quota" style="margin-top:8px"></div></section>
    <section style="margin-top:12px"><h2>能力边界 · 本系统不做的事（债务带验证日期）</h2>
      <ul id="bounds"></ul></section>
  </div>
  <div>
    <section><h2>数据流 · PIPELINE</h2>
      <div class="tiles" id="tiles"></div>
      <div id="sfrow"></div></section>
    <section style="margin-top:12px">
      <h2>事件流 AUDIT（ev 五类 · 游标增量 · 只读）
        <button id="copy" style="float:right;background:none;border:1px solid var(--line);color:var(--dim);border-radius:3px;cursor:pointer;font-size:10px">复制最近 50 条 JSON</button>
      </h2><div id="events"></div></section>
  </div>
</main>
<footer><span id="pollstate">idle</span><span id="lastts"></span></footer>
<div id="auth"><div class="card">
  <b>Ops Console 凭证</b><div class="msg" id="authmsg"></div>
  <input id="jwt" type="password" placeholder="粘贴 sre-full（role=platform）login 的 JWT" autocomplete="off">
  <button id="go">接入面板</button>
  <p style="color:var(--dim);font-size:11px">token 仅存本浏览器 localStorage；取 token 命令见 OPS.md §9。
  面板只读，不会消耗配额。</p>
</div></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const CAP = 200;                    // 审计游标每拉 200，DOM 保 60
let token = localStorage.getItem('opspilot.jwt') || '';
let cursor = 0, prevMetrics = null, pollTimer = null, alive = false;

async function api(path) {
  const r = await fetch(path, { headers: token ? { Authorization: 'Bearer ' + token } : {} });
  if (r.status === 401 || r.status === 403) { throw { auth: r.status }; }
  if (!r.ok) throw { err: 'HTTP ' + r.status };
  return r.json();
}
function showAuth(kind) {
  $('auth').style.display = 'grid'; document.body.classList.add('sat');
  $('authmsg').textContent =
    kind === 401 ? '401 · token 已过期或无效——重新 login 后粘贴（OPS.md §9）' :
    kind === 403 ? '403 · 该 token 的账号不是平台管理员（面板需 DB role=platform；' +
                   '密级高≠可信，见 ADR-0008）。请改用 sre-full 的 token。' :
    '面板需要 role=platform 账号的 JWT（数据端点全部受守卫，HTML 壳本身零信息）';
  stopPoll();
}
function hideAuth() { $('auth').style.display = 'none'; document.body.classList.remove('sat'); }
function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }
function startPoll() { stopPoll(); poll(); pollTimer = setInterval(poll, cadence()); }
function cadence() { return document.visibilityState === 'visible' ? 2000 : 30000; }
document.addEventListener('visibilitychange', () => { if (pollTimer && alive) startPoll(); });

async function poll() {
  let s, a;
  try { s = await api('/api/v1/admin/state'); }
  catch (e) { if (e.auth) { alive = false; showAuth(e.auth); return; }
    $('pollstate').textContent = '网关不可达：' + (e.err || e) + '（降频重试中）';
    $('pollstate').style.color = 'var(--err)'; return; }
  try { a = await api('/api/v1/admin/audit/recent?since=' + cursor + '&limit=' + CAP); }
  catch (e) { if (e.auth) { showAuth(e.auth); return; } a = null; }
  alive = true; hideAuth();
  $('pollstate').textContent = '轮询中 · ' + (cadence() / 1000) + 's'; $('pollstate').style.color = '';
  renderState(s); if (a) renderEvents(a);
}

function renderState(s) {
  const b = s.build;
  $('fingerprint').textContent = 'build ' + b.version + ' · jvm ' + b.jvm +
    ' · uptime ' + Math.floor(b.uptime_s / 3600) + 'h' + Math.floor(b.uptime_s % 3600 / 60) +
    'm · pid ' + b.pid;
  $('lastts').textContent = 'server ts ' + new Date(s.ts).toLocaleTimeString();
  const h = s.health;
  const lamp = (k, c) => '<span class="lamp"><span class="dot ' + c.status + '"></span>' + k +
    (c.value != null ? ' <b>' + c.value.toLocaleString() + '</b>' : '') + '</span>';
  $('lights').innerHTML = lamp('总', { status: h.status }) + lamp('ES docs', h.es) +
    lamp('Qdrant pts', h.qdrant) + lamp('Redis', h.redis) +
    '<span class="lamp">' + (h.live_mode ? '🟢 live' : '🟡 mock') + '</span>';
  const ri = s.runtime.reingest;
  $('reingest').textContent = 'reingest: ' + (ri.busy ? '⏳ 执行中' : '空闲') + ' · last: ' + ri.last;
  const d = s.runtime.degradation;
  $('deg').innerHTML = ['L0', 'L1', 'L2'].map(l =>
    '<span class="lamp"><span class="dot ' + (d.level === l ? 'UP' : '') + '"></span>' + l + '</span>'
  ).join('') + '<span class="lamp">熔断 K/' + d.threshold + ' = <b>' + d.failures + '</b></span>' +
    (d.cooldown_s > 0 ? '<span class="lamp">冷却 <b>' + d.cooldown_s + 's</b></span>' : '') +
    (d.manual ? '<span class="chip">MANUAL LOCK</span>' : '');
  const q = s.runtime.quota;
  $('quota').innerHTML = '当日配额 ' + q.sub + '：<b>' + q.used + '</b> / ' + q.limit +
    '<div class="bar"><i style="width:' + Math.min(100, q.used / q.limit * 100) + '%"></i></div>';
  renderTiles(s.metrics);
  $('sfrow').innerHTML = 'Single-Flight 在途组 <b>' + s.runtime.sf_groups + '</b> · inflight ' +
    s.runtime.inflight + ' ' + (s.runtime.sf_keys_top || []).map(
      k => '<span class="chip">' + esc(maskKey(k)) + '</span>').join('');
}
function maskKey(k) { const p = k.split(':'); return p.length > 2 ? p[0] + ':' + p[1].slice(0, 8) + ':' + p[2] : k; }
function renderTiles(m) {
  const keys = [['total_requests', '请求'], ['llm_calls', 'LLM'], ['l1_cache_hits', 'L1 命中'],
    ['l2_cache_hits', 'L2 命中'], ['dedup_aggregated', '收敛'], ['low_confidence_refusals', '拒答'],
    ['retrieval_timeouts', '检索超时'], ['es_only_requests', 'ES-only'], ['sop_fallbacks', 'SOP 直出'],
    ['llm_rate_limited', 'LLM 429']];
  $('tiles').innerHTML = keys.map(([k, label]) => {
    const v = m[k] | 0, d = prevMetrics ? v - (prevMetrics[k] | 0) : 0;
    return '<div class="tile"><div class="v">' + v.toLocaleString() + '</div><div class="k">' + label +
      ' ' + k + '</div><div class="delta">' + (d > 0 ? '+' + d : '') + '</div></div>';
  }).join('');
  prevMetrics = m;
}
function renderEvents(a) {
  if (a.truncated) {
    prepend('<div class="ev lost">⚠️ 事件丢失（缓冲轮转或服务重启，游标已跳至 ' + a.max_seq + '）</div>');
  }
  for (const ev of a.events) {
    cursor = Math.max(cursor, ev.seq | 0);
    const cls = [ev.ev, ev.refused ? 'refused' : '',
      ev.src_tenant && ev.src_tenant !== ev.tenant ? 'mismatch' : '',
      ev.cache_hit === 'L1' || ev.cache_hit === 'L2' ? 'badge-l1' : ''].join(' ');
    const detail = ev.ev === 'auth' || ev.ev === 'admin' ? (ev.outcome + ' ' + (ev.reason || ev.action || '')) :
      [ev.via, ev.cache_hit !== 'none' ? ev.cache_hit : '', ev.mode, ev.q || ev.path || ev.msg || ''].filter(Boolean).join(' · ');
    const srcAlarm = ev.src_tenant && ev.src_tenant !== ev.tenant ? ' ⚡跨租户回放!' : '';
    prepend('<div class="ev ' + cls + '"><span class="t">' + new Date(ev.ts).toLocaleTimeString() +
      '</span> <span class="b">' + ev.ev + '</span> [' + (ev.sub || '?') + '/' + ev.level + '] ' +
      esc(detail) + srcAlarm + '</div>');
  }
  if (a.max_seq < cursor) cursor = a.max_seq;   // 服务端重启后游标对齐
}
let evBuf = [];
function prepend(html) {
  const box = $('events');
  box.insertAdjacentHTML('afterbegin', html);
  while (box.childElementCount > 60) box.lastElementChild.remove();
}
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

// 能力边界声明块：与 OPS.md 债务闹钟表 / README 声明同源，checked=人工复核日期（改文档同步更新）
const BOUNDS = [
  ['单轮无状态（/v1 忽略历史，多轮由客户端拼单条）', 'ADR-0007', '2026-09-11'],
  ['无 TLS / 端口仅环回绑定（跨机访问触发升级线）', 'OPS 债务表', '2026-09-11'],
  ['单实例进程内 Single-Flight（>200 人或 QPS50 引分布式）', 'ADR-0003', '2026-09-11'],
  ['无文件上传/语音/多模态端点（客户端里点了会报错）', 'OPS §7', '2026-09-11'],
  ['日配额 5000/人（成本护栏，非防攻击）', 'QuotaService', '2026-09-12'],
  ['审计文件 14 天滚动（长期合规引 Loki/对象存储）', 'logback', '2026-09-12'],
  ['本面板只读：零写操作、零假数据、轮询不污染审计', 'ADR-0009', '2026-09-12']];
$('bounds').innerHTML = BOUNDS.map(x =>
  '<li>✗ ' + esc(x[0]) + '<div class="chk">依据 ' + esc(x[1]) + ' · 最后验证 ' + x[2] + '</div></li>').join('');

$('copy').onclick = async () => {
  const a = await api('/api/v1/admin/audit/recent?since=' + Math.max(0, cursor - 50) + '&limit=50')
    .catch(() => null);
  if (a) { await navigator.clipboard.writeText(JSON.stringify(a.events, null, 2));
    $('copy').textContent = '已复制 ✓'; setTimeout(() => $('copy').textContent = '复制最近 50 条 JSON', 1500); }
};
$('go').onclick = () => {
  const t = $('jwt').value.trim(); if (!t) return;
  token = t; localStorage.setItem('opspilot.jwt', t); cursor = 0; prevMetrics = null;
  $('events').innerHTML = ''; poll().then(() => { if (alive) startPoll(); });
};
if (token) { poll().then(() => { if (alive) startPoll(); }); } else showAuth(0);

</script>
</body>
</html>
