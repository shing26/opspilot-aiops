server:
  port: ${SERVER_PORT:8081}   # 8080 被本机 nexus-web 占用，OpsPilot 用 8081

spring:
  application:
    name: opspilot-gateway
  # P2 账号体系主库：H2 文件模式，AUTO_SERVER 允许 CLI 与服务并存时同库读写；
  # 口令只从环境注入（H2_DB_PASSWORD），源码/示例零凭据字面量
  datasource:
    url: ${H2_DB_URL:jdbc:h2:file:./data/users;AUTO_SERVER=TRUE}
    username: ${H2_DB_USER:opspilot}
    password: ${H2_DB_PASSWORD:}
  sql:
    init:
      mode: always
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

opspilot:
  dashscope:
    base-url: https://dashscope.aliyuncs.com
    api-key: ${DASHSCOPE_API_KEY:}
    mode: ${DASHSCOPE_MODE:auto}   # auto=有Key走live否则mock | live | mock
    embedding-model: text-embedding-v3
    embedding-dim: 1024
    rerank-model: ${RERANK_MODEL:gte-rerank-v2}   # 旧 gte-rerank 已停授权(403)，v2 为同族直升，min-relevance 分数分布兼容
    llm-model: qwen-plus
    llm-timeout-seconds: 60
  es:
    uri: http://${ES_HOST:localhost}:9200
    index: opspilot-chunks
  qdrant:
    host: ${QDRANT_HOST:localhost}
    grpc-port: 6334
    collection: opspilot-vectors
    cache-collection: semantic-cache
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}   # P2：短时凭证 24h（吊销靠每请求查库，不靠短 TTL 兜底）
  cache:
    l1-ttl-hours: 2
    l2-threshold: 0.95
  storm:
    window-seconds: 30
    alert-window-seconds: 60
  retrieval:
    es-top-k: 50
    qdrant-top-k: 50
    rrf-k: 60
    rerank-top-k: 20
    final-top-k: 3
    leg-timeout-ms: ${LEG_TIMEOUT_MS:4500}   # mock 时代 800ms；live 实测 DashScope embedding 2.2-3.7s，取观测 P99+检索余量
    min-relevance: ${MIN_RELEVANCE:0.2}   # Top-1 相关度低于此值→空态拒答（快路径豁免）
  degrade:
    inflight-threshold: 40
    llm-failure-threshold: 3
    llm-open-seconds: 60

logging:
  level:
    com.opspilot: INFO
